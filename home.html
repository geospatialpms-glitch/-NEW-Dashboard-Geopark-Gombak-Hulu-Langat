<style>
:root{
  --dark:#07251b;
  --dark2:#0b3525;
  --lime:#d8ef59;
  --lime2:#b7d93e;
  --white:#f7faf6;
  --green:#11713b;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:var(--dark)}
body{overflow:hidden}
.topbar{
  height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 42px;
  background:linear-gradient(90deg,#061d16 0%,#0a2d20 62%,#09271d 100%);
  color:#fff;
  border-bottom:1px solid rgba(255,255,255,.08);
  position:relative;
  z-index:5;
}
.brand{display:flex;align-items:center;gap:18px;min-width:0}
.brand-logo{display:flex;align-items:center;height:50px;padding-right:18px;border-right:1px solid rgba(255,255,255,.23)}
.brand-logo img{height:58px;width:auto;max-width:90px;object-fit:contain;display:block}
.brand-fallback{display:flex;align-items:center;gap:6px;font-weight:900}
.brand-fallback span{background:var(--lime);color:var(--dark);padding:5px 8px;border-radius:5px}
.brand-fallback b{font-size:17px}
.brand-copy b{display:block;font-size:14px;margin-bottom:5px;white-space:nowrap}
.brand-copy small{display:block;font-size:12px;letter-spacing:.04em;color:#c9d4ce;font-weight:700;text-transform:none}
.dashboard-login{
  display:flex;align-items:center;gap:9px;
  border:1px solid rgba(255,255,255,.24);
  color:#fff;text-decoration:none;
  border-radius:999px;padding:10px 18px;
  font-size:11px;font-weight:800;
}
.dashboard-login .user{font-size:16px}
.hero{
  position:relative;
  height:calc(100vh - 72px);
  min-height:590px;
  background:none;

  background-size:cover;
  background-position:center 48%;
}
.hero-content{
  position:absolute;
  left:5.55%;
  top:15%;
  color:#fff;
  max-width:690px;
}
.hero-title{
  font-size:61px;
  line-height:.94;
  font-weight:900;
  letter-spacing:-2px;
  margin:0;
}
.hero-title span{display:block;color:var(--lime);font-size:67px}
.hero-sub{font-size:17px;font-weight:800;margin:22px 0 0}
.hero-desc{font-size:15px;color:var(--lime);font-weight:700;margin:18px 0 30px;line-height:1.45}
.explore{
  display:inline-flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  min-width:220px;
  padding:10px 11px 10px 20px;
  border-radius:999px;
  background:var(--lime);
  color:#0a3423;
  text-decoration:none;
  font-size:13px;
  font-weight:900;
  box-shadow:0 8px 24px rgba(0,0,0,.18);
  transition:.2s ease;
}
.explore:hover{transform:translateY(-2px);background:#e5f878}
.explore .arrow{
  width:34px;height:34px;
  border-radius:50%;
  display:grid;place-items:center;
  background:#0d6840;color:#fff;
  font-size:18px;font-weight:900;
}
.journey{
  position:absolute;
  left:2.35%;
  bottom:3.8%;
  display:flex;align-items:center;
  gap:13px;
  min-width:290px;
  padding:12px 17px;
  background:rgba(251,253,246,.95);
  color:#103826;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,.16);
}
.journey .round{
  width:43px;height:43px;border-radius:50%;
  display:grid;place-items:center;
  background:#0f7045;color:#dff56c;
  font-size:20px;font-weight:900;
}
.journey b{display:block;font-size:12px;margin-bottom:4px}
.journey span{display:block;font-size:10px;color:#607066}
.journey .plus{margin-left:auto;font-size:16px;font-weight:900}
.featured{
  position:absolute;
  right:2.3%;
  bottom:3.2%;
  width:310px;
  min-height:168px;
  background:linear-gradient(135deg,#deef6d,#cde852);
  color:#123826;
  border-radius:18px;
  padding:16px 18px;
  box-shadow:0 12px 28px rgba(0,0,0,.20);
}
.featured-top{display:flex;justify-content:space-between;font-size:8px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#61762b}
.featured-main{display:grid;grid-template-columns:1fr 74px;gap:12px;align-items:center;margin-top:15px}
.featured small{font-size:9px;color:#677536}
.featured h3{font-size:19px;line-height:1;margin:5px 0 6px}
.featured p{font-size:9px;line-height:1.45;margin:0 0 10px;color:#5f6c37}
.featured-thumb{
  width:74px;height:74px;border-radius:12px;
  background:none;

  background-size:cover;background-position:74% 50%;
  border:4px solid #fff;
}
.featured a{

  background:#0a3e2a;color:#fff;text-decoration:none;
  padding:7px 10px;border-radius:7px;
  font-size:9px;font-weight:800;
}
.credit{

  transform:translateX(-50%);

  white-space:nowrap;
  opacity:.9;

.credit-logos{display:flex;align-items:center;justify-content:center;gap:18px}
.credit-logos img{height:76px;width:106px;object-fit:contain;filter:drop-shadow(0 3px 5px rgba(0,0,0,.35))}
.credit-logos img.selangor-crest{height:72px;width:77px}

<script>
/* Restore homepage video playback after refresh, page restore or tab return. */
(function(){
  const video=document.querySelector('main.hero > video.ghlgp-home-video');
  if(!video)return;
  video.muted=true;
  video.defaultMuted=true;
  video.autoplay=true;
  video.loop=true;
  video.playsInline=true;
  function startVideo(){
    if(video.readyState>=2)video.parentElement.classList.add('ghlgp-video-ready');
    if(video.paused){
      const attempt=video.play();
      if(attempt&&typeof attempt.catch==='function')attempt.catch(function(){});
    }
  }
  video.addEventListener('loadeddata',startVideo);
  video.addEventListener('canplay',startVideo);
  video.addEventListener('stalled',function(){if(!document.hidden)startVideo()});
  window.addEventListener('pageshow',startVideo);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)startVideo()});
  startVideo();
})();
</script>

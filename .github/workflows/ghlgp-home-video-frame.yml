name: Tepatkan video homepage pada ruang bawah header
on:
  push:
    paths: ['.github/workflows/ghlgp-home-video-frame.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Laras keluasan video mengikut hero viewport
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('home.html')
          s=p.read_text(encoding='utf-8')
          assert 'Video-Project-4-web.mp4' in s
          css='''<style id="ghlgp-home-video-boundary">
          /* Full-bleed video, exactly below the 72px header, no black bars. */
          html,body{width:100%!important;min-height:100%!important;margin:0!important}
          body>.topbar{height:72px!important;min-height:72px!important;max-height:72px!important}
          body>main.hero{box-sizing:border-box!important;position:relative!important;isolation:isolate!important;overflow:hidden!important;margin:0!important;padding:0!important;top:auto!important;left:auto!important;right:auto!important;bottom:auto!important;width:100vw!important;max-width:100%!important;height:calc(100dvh - 72px)!important;min-height:0!important;max-height:calc(100dvh - 72px)!important;border:0!important}
          body>main.hero>video.ghlgp-home-video{display:block!important;position:absolute!important;inset:0!important;top:0!important;left:0!important;width:100%!important;height:100%!important;min-width:0!important;min-height:0!important;max-width:none!important;object-fit:cover!important;object-position:50% 50%!important;z-index:0!important;pointer-events:none!important}
          body>main.hero::after{z-index:1!important}
          body>main.hero>.hero-content,body>main.hero>.credit{z-index:2!important}
          @supports not (height:100dvh){body>main.hero{height:calc(100vh - 72px)!important;max-height:calc(100vh - 72px)!important}}
          </style>'''
          import re
          s=re.sub(r'<style id="ghlgp-home-video-boundary">.*?</style>', '', s, flags=re.S)
          s=s.replace('</head>',css+'\n</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit without changing homepage content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ghlgp-home-video-frame.yml
          git add home.html
          git commit -m "Fit homepage video exactly within screen below header"
          git push

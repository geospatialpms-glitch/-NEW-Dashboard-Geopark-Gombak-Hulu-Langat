name: Buang header homepage GHLGp
on:
  push:
    paths:
      - '.github/workflows/remove-home-header-ghlgp.yml'
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ubah home.html sahaja
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('home.html')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'<header\s+class="topbar"[^>]*>.*?</header>\s*','',s,count=1,flags=re.S)
          assert n==1, 'Header homepage tidak ditemui'
          css='''
          /* Homepage tanpa header: video penuh bermula dari bahagian atas */
          .topbar{display:none!important}
          html,body{margin:0!important;padding:0!important}
          body{overflow:hidden!important}
          main.hero,.hero{
            position:relative!important;top:0!important;margin:0!important;
            width:100%!important;height:100vh!important;height:100dvh!important;
            min-height:0!important;overflow:hidden!important
          }
          .ghlgp-home-video{
            position:absolute!important;inset:0!important;display:block!important;
            width:100%!important;height:100%!important;
            object-fit:cover!important;object-position:center!important;
          }
          '''
          assert '</style>' in s
          s=s.replace('</style>',css+'\n</style>',1)
          p.write_text(s,encoding='utf-8')
          print('Header dibuang; background video memenuhi skrin:',n)
          PY
      - name: Simpan dan buang workflow sementara
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remove-home-header-ghlgp.yml
          git add home.html
          git commit -m "Buang header homepage dan penuhi skrin dengan video"
          git push

name: Susun logo SUO pada hero
on:
  push:
    paths: ['.github/workflows/ghlgp-suo-hero.yml']
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Letak logo di atas label SUO
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dashboard.html')
          s=p.read_text(encoding='utf-8')
          anchor='<div class="ghl-mock-hero-inner"><small>SELANGOR URBAN OBSERVATORY</small>'
          assert anchor in s, 'Label hero tidak ditemui'
          s=s.replace(anchor,'<div class="ghl-mock-hero-inner"><img class="ghl-suo-mark" src="suo-hero-logo.svg" alt="Logo Selangor Urban Observatory" width="84" height="84"><small>SELANGOR URBAN OBSERVATORY</small>',1)
          import re
          s=re.sub(r'geopark-portal-theme\.css\?v=[^"]+','geopark-portal-theme.css?v=20261026-suohero',s,count=1)
          p.write_text(s,encoding='utf-8')
          c=Path('geopark-portal-theme.css');css=c.read_text(encoding='utf-8')
          css+="""
          /* SUO branding above existing hero eyebrow; keep scenic imagery and content unchanged */
          #utama .ghl-mock-hero-inner .ghl-suo-mark{
            display:block!important;width:80px!important;height:80px!important;
            object-fit:contain!important;margin:0 0 12px!important;
            border-radius:10px!important;background:rgba(255,255,255,.94)!important;
            padding:5px!important;box-shadow:0 5px 20px rgba(0,28,20,.25)!important;
          }
          #utama .ghl-mock-hero-inner small{display:block!important;margin-bottom:4px!important}
          @media(max-width:700px){#utama .ghl-mock-hero-inner .ghl-suo-mark{width:64px!important;height:64px!important;margin-bottom:10px!important}}
          """
          c.write_text(css,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ghlgp-suo-hero.yml
          git add dashboard.html geopark-portal-theme.css
          git commit -m "Letak logo SUO dan harmonikan label banner"
          git push

name: Betulkan video homepage penuh skrin
on:
  push:
    paths: ['.github/workflows/fix-home-video-viewport.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('home.html')
          s=p.read_text(encoding='utf-8')
          assert '<video class="ghlgp-home-video"' in s
          assert 'Video-Project-4-web.mp4' in s
          marker='<style id="ghlgp-video-viewport-exact">'
          if marker not in s:
              css='''<style id="ghlgp-video-viewport-exact">
          :root{--ghlgp-header-height:72px}
          html,body{margin:0!important;width:100%!important;height:100%!important}
          body{min-height:100dvh!important;overflow:hidden!important}
          body>.topbar{height:var(--ghlgp-header-height)!important;min-height:var(--ghlgp-header-height)!important;max-height:var(--ghlgp-header-height)!important;box-sizing:border-box!important}
          body>main.hero{position:relative!important;display:block!important;overflow:hidden!important;isolation:isolate!important;width:100%!important;height:calc(100dvh - var(--ghlgp-header-height))!important;min-height:0!important;max-height:calc(100dvh - var(--ghlgp-header-height))!important;background-color:#092c20}
          body>main.hero>video.ghlgp-home-video{display:block!important;position:absolute!important;inset:0!important;width:100%!important;height:100%!important;min-width:0!important;min-height:0!important;object-fit:cover!important;object-position:center center!important;z-index:0!important;pointer-events:none!important}
          body>main.hero::after{z-index:1!important;pointer-events:none!important}
          body>main.hero>.hero-content,body>main.hero>.credit{z-index:2!important}
          @supports not (height:100dvh){body>main.hero{height:calc(100vh - var(--ghlgp-header-height))!important;max-height:calc(100vh - var(--ghlgp-header-height))!important}}
          </style>'''
              s=s.replace('</head>',css+'\n</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-home-video-viewport.yml
          git add home.html
          git commit -m "Laraskan video homepage tepat satu skrin di bawah header"
          git push

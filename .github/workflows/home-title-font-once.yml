name: Font tajuk homepage GHLGp
on:
  push:
    paths: ['.github/workflows/home-title-font-once.yml']
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harmonikan font tajuk home sahaja
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('home.html')
          s=p.read_text(encoding='utf-8')
          assert 'class="hero-title"' in s and 'ghlgp-home-video' in s
          start='<!-- GHLGp SERIF HOMEPAGE TITLE -->'
          end='<!-- END GHLGp SERIF HOMEPAGE TITLE -->'
          if start in s:
              pre,rest=s.split(start,1)
              rest=rest.split(end,1)[1]
              s=pre+rest
          block='''<!-- GHLGp SERIF HOMEPAGE TITLE -->
          <style id="ghlgp-serif-home-title">
          /* Classic high-contrast serif inspired by the supplied screenshot. */
          .hero .hero-title,
          .hero .hero-title .hero-title-place,
          .hero .hero-title span {
            font-family:Georgia,"Times New Roman",Times,serif!important;
            font-weight:700!important;
            color:#fff8eb!important;
            letter-spacing:-.025em!important;
            line-height:1.06!important;
            text-shadow:0 3px 15px rgba(3,27,21,.55),0 1px 2px rgba(0,0,0,.36)!important;
          }
          .hero .hero-title{font-size:clamp(35px,4.25vw,74px)!important;max-width:1200px!important}
          .hero .hero-title .hero-title-place{
            font-size:inherit!important;
            line-height:inherit!important;
            white-space:normal!important;
          }
          @media(max-width:720px){
            .hero .hero-title{font-size:clamp(30px,7.4vw,48px)!important;letter-spacing:-.018em!important}
            .hero .hero-title .hero-title-place{white-space:normal!important}
          }
          </style>
          <!-- END GHLGp SERIF HOMEPAGE TITLE -->
          '''
          assert '</head>' in s
          s=s.replace('</head>',block+'\n</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/home-title-font-once.yml
          git add home.html
          git commit -m "Gaya font serif putih gading untuk tajuk homepage"
          git push

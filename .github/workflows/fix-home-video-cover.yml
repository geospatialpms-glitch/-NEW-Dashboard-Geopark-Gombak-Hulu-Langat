name: Padankan saiz video homepage
on:
  push:
    paths:
      - '.github/workflows/fix-home-video-cover.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Jadikan video penuh pada background hero
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('home.html')
          s=p.read_text('utf-8')
          assert 'Video-Project-4-web.mp4' in s
          assert 'ghlgp-home-video' in s
          patch="""
          <style id="ghlgp-home-video-cover-final">
          html,body{width:100%;min-height:100%;margin:0}
          main.hero{position:relative!important;isolation:isolate!important;overflow:hidden!important;width:100%!important;min-height:calc(100svh - 72px)!important;height:calc(100svh - 72px)!important}
          main.hero>.ghlgp-home-video{display:block!important;position:absolute!important;top:0!important;left:0!important;right:0!important;bottom:0!important;width:100%!important;height:100%!important;min-width:100%!important;min-height:100%!important;object-fit:cover!important;object-position:center center!important;z-index:0!important;pointer-events:none!important}
          main.hero::after{z-index:1!important;pointer-events:none!important}
          main.hero>.hero-content,main.hero>.credit{z-index:2!important}
          @media(max-width:700px){main.hero{height:calc(100svh - 72px)!important;min-height:590px!important}}
          @media(prefers-reduced-motion:reduce){main.hero>.ghlgp-home-video{display:none!important}}
          </style>
          """
          if 'id="ghlgp-home-video-cover-final"' not in s:
              s=s.replace('</head>',patch+'\n</head>',1)
          p.write_text(s,'utf-8')
          PY
      - name: Simpan perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-home-video-cover.yml
          git add home.html
          git commit -m "Laraskan video latar homepage memenuhi saiz hero"
          git push

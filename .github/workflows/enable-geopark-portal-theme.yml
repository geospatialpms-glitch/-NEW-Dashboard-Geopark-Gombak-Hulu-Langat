name: Aktifkan tema portal GHL Geopark
on:
  push:
    paths: ['.github/workflows/enable-geopark-portal-theme.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pasang stylesheet tanpa menyentuh data atau skrip dashboard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dashboard.html')
          s=p.read_text('utf-8')
          new='<link rel="stylesheet" href="geopark-portal-theme.css?v=20261023">'
          if new not in s:
              assert '</head>' in s
              s=s.replace('</head>',new+'\n</head>',1)
              p.write_text(s,'utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/enable-geopark-portal-theme.yml
          git add dashboard.html
          git commit -m "Aktifkan tema GHL Geopark pada dashboard"
          git push

name: Video latar homepage GHLGp
on:
  push:
    paths: ['.github/workflows/home-video-background.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tambah video latar sambil kekalkan kandungan homepage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('home.html')
          s=p.read_text(encoding='utf-8')
          assert '<main class="hero">' in s
          css="""<style id="ghlgp-home-video-style">
          .hero{isolation:isolate}
          .hero>.ghlgp-home-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;z-index:0;pointer-events:none}
          .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,27,19,.60),rgba(4,27,19,.27) 50%,rgba(4,27,19,.20)),linear-gradient(0deg,rgba(4,25,18,.48),transparent 42%);z-index:1;pointer-events:none}
          .hero>.hero-content,.hero>.credit{z-index:2}
          .hero>.hero-content{position:absolute}
          .hero>.credit{position:absolute}
          @media(prefers-reduced-motion:reduce){.ghlgp-home-video{display:none!important}}
          </style>"""
          vid='<video class="ghlgp-home-video" autoplay muted loop playsinline preload="metadata" aria-hidden="true"><source src="Video-Project-4-web.mp4" type="video/mp4"></video>'
          if 'ghlgp-home-video-style' not in s:s=s.replace('</head>',css+'\n</head>',1)
          if 'class="ghlgp-home-video"' not in s:s=s.replace('<main class="hero">','<main class="hero">\n'+vid,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/home-video-background.yml
          git add home.html
          git commit -m "Ganti latar homepage dengan video MP4 dan fallback gambar asal"
          git push

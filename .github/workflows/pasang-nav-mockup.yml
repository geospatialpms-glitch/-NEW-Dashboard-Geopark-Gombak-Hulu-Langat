name: Pasang navigasi mockup
on:
  push:
    paths: ['.github/workflows/pasang-nav-mockup.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dashboard.html');s=p.read_text('utf8')
          old='<script id="ghl-inline-scroll-nav">'
          assert old in s
          s=s.replace(old,'<script id="ghl-inline-scroll-nav" type="application/x-disabled">',1)
          assert 'id="ghlExplore"' in s
          mark='<div class="sidebar-slogan">'
          assert mark in s
          s=s.replace(mark,'<button class="navbtn" type="button" data-ghl-go="taburan">▧ Peta Interaktif</button><button class="navbtn" type="button" data-ghl-go="section-galeri">▦ Galeri</button>'+mark,1)
          s=s.replace('href="jejak-geologi.html">Teroka Jejak ↗','href="#section-galeri" data-ghl-go="section-galeri">Teroka Jejak ↗',1)
          s=s.replace('href="jejak-makanan.html">Lihat Gambaran ↗','href="#section-makanan" data-ghl-show="makanan">Lihat Gambaran ↗',1)
          s=s.replace('href="jejak-warisan.html">Lihat Gambaran ↗','href="#section-warisan" data-ghl-show="warisan">Lihat Gambaran ↗',1)
          s=s.replace('</body>','<script src="ghlgp-navigation.js?v=2"></script></body>',1)
          p.write_text(s,'utf8')
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pasang-nav-mockup.yml
          git add dashboard.html
          git commit -m "Sambung fungsi navigasi mockup pada dashboard"
          git push

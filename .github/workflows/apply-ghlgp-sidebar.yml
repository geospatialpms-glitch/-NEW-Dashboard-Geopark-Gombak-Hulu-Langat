name: Sidebar GHLGp ikut rujukan
on:
  push:
    paths: ['.github/workflows/apply-ghlgp-sidebar.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kemaskan sidebar sahaja
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('geopark-portal-theme.css')
          s=p.read_text(encoding='utf-8')
          marker='/* SIDEBAR SCREENSHOT 2026-10-23 */'
          s=s.split(marker)[0]
          s+='''
          /* SIDEBAR SCREENSHOT 2026-10-23 */
          .shell{grid-template-columns:194px minmax(0,1fr)!important}
          .sidebar{
            position:relative!important;display:flex!important;flex-direction:column!important;
            padding:12px 0 0!important;min-height:calc(100vh - 72px)!important;
            background:linear-gradient(180deg,rgba(5,71,45,.89),rgba(5,107,53,.83) 46%,rgba(26,135,44,.69) 100%),url('sidebar-geopark.png') center center/cover no-repeat!important;
            overflow:hidden!important;border:0!important;box-shadow:4px 0 16px #052d1b18!important
          }
          .sidebar::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.21;background:repeating-radial-gradient(ellipse at -30% 60%,transparent 0 27px,#d0f2c540 28px,transparent 29px,transparent 56px)}
          .sidebar>*{position:relative;z-index:2}
          .ghl-sidebar-brand{display:none!important}
          .sidebar .navbtn{
            width:calc(100% - 20px)!important;min-height:46px!important;flex-shrink:0!important;
            margin:0 10px 6px!important;padding:11px 13px!important;
            background:transparent!important;color:#fff!important;border-radius:11px!important;
            font-size:12px!important;font-weight:700!important;line-height:1.4!important;
            box-shadow:none!important;display:flex!important;align-items:center!important;gap:10px!important;
            text-align:left!important
          }
          .sidebar .navbtn:hover{background:#ffffff1e!important;transform:translateX(1px)}
          .sidebar .navbtn.active{background:linear-gradient(95deg,#eb5b2c,#bd262a)!important;box-shadow:0 9px 24px #831f1f55!important;color:white!important}
          .sidebar .navicon{width:18px!important;min-width:18px!important;height:18px!important;display:flex!important;align-items:center!important;justify-content:center!important}
          .sidebar .navicon svg{width:16px!important;height:16px!important;stroke:#fff!important}
          .jejak-sidebar-info[hidden]{display:none!important}
          .jejak-sidebar-submenu{display:flex!important;flex-direction:column!important;flex-shrink:0!important;gap:5px!important;margin:-1px 0 12px 40px!important;padding:1px 0 1px 13px!important;border-left:1px solid #ffffff55!important}
          .jejak-sidebar-link{background:transparent!important;color:#fff!important;border:0!important;padding:8px 2px!important;border-radius:4px!important;font-size:12px!important;font-weight:650!important;text-align:left!important;line-height:1.3!important}
          .jejak-sidebar-link:hover{background:#ffffff16!important;transform:translateX(2px)}
          .sidebar-slogan{position:relative!important;left:auto!important;right:auto!important;bottom:auto!important;margin-top:auto!important;padding:55px 8px 34px!important;text-align:center!important;font-size:15px!important;font-weight:800!important;line-height:1.35!important;text-shadow:0 2px 7px #003b264e;pointer-events:none!important}
          @media(max-width:900px){.shell{grid-template-columns:minmax(0,1fr)!important}.sidebar{min-height:700px!important}}
          @media(prefers-reduced-motion:reduce){.sidebar .navbtn,.jejak-sidebar-link{transition:none!important}}
          '''
          p.write_text(s,encoding='utf-8')
          h=Path('dashboard.html'); html=h.read_text(encoding='utf-8')
          html=html.replace('geopark-portal-theme.css?v=20261023','geopark-portal-theme.css?v=20261023-sidebar2')
          h.write_text(html,encoding='utf-8')
          PY
      - name: Commit and delete one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-ghlgp-sidebar.yml
          git add dashboard.html geopark-portal-theme.css
          git commit -m "Padankan sidebar hijau dan menu jejak mengikut screenshot"
          git push

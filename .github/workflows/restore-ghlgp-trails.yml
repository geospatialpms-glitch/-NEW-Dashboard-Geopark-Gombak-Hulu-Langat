name: Pulihkan maklumat penuh setiap jejak
on:
  push:
    paths: ['.github/workflows/restore-ghlgp-trails.yml']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pulihkan pautan jejak ke halaman terperinci
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dashboard.html');s=p.read_text('utf-8')
          for old,new in [
            ('href="#section-galeri" data-ghl-go="section-galeri">Teroka Jejak ↗','href="jejak-geologi.html">Teroka Jejak ↗'),
            ('href="#section-makanan" data-ghl-show="makanan">Lihat Gambaran ↗','href="jejak-makanan.html">Lihat Maklumat ↗'),
            ('href="#section-warisan" data-ghl-show="warisan">Lihat Gambaran ↗','href="jejak-warisan.html">Lihat Maklumat ↗')
          ]:
            assert old in s, 'Pautan lama tidak ditemui: '+old
            s=s.replace(old,new,1)
          s=s.replace('ghlgp-navigation.js?v=2','ghlgp-navigation.js?v=restore3')
          p.write_text(s,'utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/restore-ghlgp-trails.yml
          git add dashboard.html
          git commit -m "Pulihkan pautan jejak ke maklumat terperinci"
          git push

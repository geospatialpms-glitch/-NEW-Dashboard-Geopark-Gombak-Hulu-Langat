name: Navigasi scroll satu halaman GHLGp
on:
  push:
    paths: ['.github/workflows/enable-ghlgp-scroll.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tambah seksyen dan scroll untuk semua menu
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('dashboard.html'); s=p.read_text('utf-8')
          anchor='<div class="footer-note">'
          assert anchor in s
          section='''<section class="ghl-scroll-sections" id="ghlExplore" aria-label="Terokai Jejak GHLGp">
          <section id="section-about" class="ghl-scroll-block"><h2>Apa Itu Geopark?</h2><p>Kenali warisan geologi, alam semula jadi dan komuniti di Gombak–Hulu Langat Geopark.</p><button class="ghl-outline" type="button" data-ghl-original="aboutGeoparkBtn">Maklumat Lanjut ↗</button></section>
          <section id="section-jejak" class="ghl-scroll-block"><h2>Terokai Jejak GHLGp</h2><p>Tiga pengalaman untuk mengenali landskap, makanan dan warisan tempatan.</p>
          <div class="ghl-trail-cards">
          <article id="section-geologi" class="ghl-trail-card"><img src="jejak-ghlgp-pilihan.png" loading="lazy" alt="Jejak Geologi"><div><h3>Jejak Geologi</h3><p>Teroka formasi batuan, gua, permatang kuarza dan air terjun.</p><a href="jejak-geologi.html">Teroka Jejak ↗</a></div></article>
          <article id="section-makanan" class="ghl-trail-card"><img src="jejak-makanan-foto-e1-e13.png" loading="lazy" alt="Jejak Makanan"><div><h3>Jejak Makanan</h3><p>Kenali sajian dan tempat makan yang membentuk identiti setempat.</p><a href="jejak-makanan.html">Lihat Gambaran ↗</a></div></article>
          <article id="section-warisan" class="ghl-trail-card"><img src="jejak-warisan-foto-w1-w3-b7-b5-g30-g29.png" loading="lazy" alt="Jejak Warisan"><div><h3>Jejak Warisan</h3><p>Hayati sejarah, komuniti dan budaya unik Gombak–Hulu Langat.</p><a href="jejak-warisan.html">Lihat Gambaran ↗</a></div></article>
          </div></section>
          <section id="section-kronologi" class="ghl-scroll-block"><h2>Kronologi Geopark</h2><p>Perkembangan asas penubuhan dan pengurusan geopark.</p><div class="ghl-years"><article><strong>2019</strong><h3>Pelan Tindakan Pembangunan Geopark</h3><p>Pengenalan konsep geopark dan dokumentasi awal.</p></article><article><strong>2020</strong><h3>Pelan Pengurusan Geopark Fasa 1</h3><p>Penyelarasan pengurusan, rangka kerja dan hala tuju geopark.</p></article><article><strong>2021–2025</strong><h3>Projek Pelaksanaan Geopark Fasa 2</h3><p>Inisiatif geopark, kerjasama berkepentingan dan pengiktirafan.</p></article></div><button class="ghl-outline" type="button" data-ghl-original="chronologyBtn">Lihat Kronologi Penuh ↗</button></section>
          <section id="section-galeri" class="ghl-scroll-block"><h2>Galeri Jejak Geologi</h2><p>Pilih jejak untuk melihat galeri dan maklumatnya.</p><div class="ghl-gallery-links"><a href="jejak-geologi.html"><img src="g30-batu-arang-aerial.jpg" loading="lazy" alt="Geotapak"><strong>Jejak Geologi ↗</strong></a><a href="jejak-makanan.html"><img src="jejak-makanan-foto-e1-e13.png" loading="lazy" alt="Galeri makanan"><strong>Jejak Makanan ↗</strong></a><a href="jejak-warisan.html"><img src="jejak-warisan-foto-w1-w3-b7-b5-g30-g29.png" loading="lazy" alt="Galeri warisan"><strong>Jejak Warisan ↗</strong></a></div></section>
          </section>
          '''
          if 'id="ghlExplore"' not in s: s=s.replace(anchor,section+anchor,1)
          script='''<script id="ghl-inline-scroll-nav">
          document.addEventListener('DOMContentLoaded',function(){
            const routes={'utama':'utama','aboutGeoparkBtn':'section-about','chronologyBtn':'section-kronologi','geoTrailBtn':'section-jejak'};
            function jump(id){const el=document.getElementById(id);if(!el)return;el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'});history.replaceState(null,'','#'+id);}
            document.querySelectorAll('.sidebar .navbtn').forEach(b=>{
              const id=b.id||b.dataset.target, target=routes[id];
              if(!target)return;
              b.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();document.querySelectorAll('.sidebar .navbtn').forEach(x=>x.classList.remove('active'));b.classList.add('active');jump(target);},true);
            });
            const destinations=['section-geologi','section-makanan','section-warisan'];
            document.querySelectorAll('.jejak-sidebar-submenu .jejak-sidebar-link').forEach((b,i)=>{
              b.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();jump(destinations[i]);},true);
            });
            document.querySelectorAll('[data-ghl-original]').forEach(b=>b.addEventListener('click',()=>{
              const orig=document.getElementById(b.dataset.ghlOriginal);
              if(orig)orig.dispatchEvent(new MouseEvent('click',{bubbles:false,cancelable:true}));
            }));
            if(location.hash&&document.querySelector(location.hash)&&location.hash.startsWith('#section-'))setTimeout(()=>jump(location.hash.slice(1)),150);
          });
          </script>'''
          assert '</body>' in s
          if 'id="ghl-inline-scroll-nav"' not in s:s=s.replace('</body>',script+'\n</body>',1)
          s=s.replace('geopark-portal-theme.css?v=20261023-fixed3','geopark-portal-theme.css?v=20261023-scroll4')
          p.write_text(s,'utf-8')
          c=Path('geopark-portal-theme.css')
          css=c.read_text('utf-8')
          css+="""
          /* One-page trail navigation */
          html{scroll-behavior:smooth;scroll-padding-top:92px}
          .ghl-scroll-block,.ghl-trail-card{scroll-margin-top:92px}
          .ghl-scroll-sections{margin:45px 0 20px;display:grid;gap:28px}
          .ghl-scroll-block{padding:8px 0 20px}
          .ghl-scroll-block>h2{font:600 clamp(25px,2.6vw,34px)/1.2 Georgia,serif;color:#0d4739;margin:0 0 4px}
          .ghl-scroll-block>p{font-size:14px;color:#5b786b;margin:0 0 18px}
          .ghl-trail-cards,.ghl-years,.ghl-gallery-links{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
          .ghl-trail-card{height:235px;position:relative;overflow:hidden;border-radius:17px;background:#0d4739;color:#fff}
          .ghl-trail-card:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#042c24ed 5%,transparent 86%);pointer-events:none}
          .ghl-trail-card>img{width:100%;height:100%;object-fit:cover}
          .ghl-trail-card>div{position:absolute;bottom:0;left:0;right:0;z-index:1;padding:20px;color:white}
          .ghl-trail-card h3{font:600 27px Georgia,serif;margin:0 0 5px;color:white}
          .ghl-trail-card p{font-size:12px;max-width:330px;margin:0 0 13px}
          .ghl-trail-card a,.ghl-outline{display:inline-block;border:1px solid #c9dfc7;border-radius:24px;background:#fff;color:#12573e;padding:10px 16px;font-weight:700;font-size:12px;cursor:pointer;text-decoration:none}
          .ghl-years article{background:#fff;border:1px solid #dce7d9;border-radius:16px;box-shadow:0 10px 25px #16492e0b;padding:24px}
          .ghl-years strong{font-size:26px;color:#0b6544}
          .ghl-years h3{font-size:14px;color:#173e2f;margin:10px 0}
          .ghl-years p{font-size:13px;color:#64786c}
          #section-kronologi .ghl-outline{margin-top:16px}
          .ghl-gallery-links a{display:block;border:1px solid #dce7d9;border-radius:14px;background:white;overflow:hidden;text-decoration:none;color:#12513a}
          .ghl-gallery-links img{width:100%;height:170px;object-fit:cover;display:block}
          .ghl-gallery-links strong{padding:12px;display:block}
          @media(max-width:760px){.ghl-trail-cards,.ghl-years,.ghl-gallery-links{grid-template-columns:1fr}.ghl-trail-card{height:205px}}
          """
          c.write_text(css,'utf-8')
          PY
      - name: Commit and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/enable-ghlgp-scroll.yml
          git add dashboard.html geopark-portal-theme.css
          git commit -m "Tambah navigasi scroll dan seksyen jejak dalam halaman dashboard"
          git push

name: Home full screen tanpa jalur hijau
on:
  push:
    paths: ['.github/workflows/ghlgp-home-fullscreen-20261026.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pastikan video memenuhi viewport tanpa jalur
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('home.html')
          s=p.read_text('utf-8')
          marker='<!-- GHLGp HOME FULLSCREEN FIX 20261026 -->'
          s=s.split(marker)[0] if marker in s else s
          insert='''<!-- GHLGp HOME FULLSCREEN FIX 20261026 -->
          <style id="ghlgp-home-fullscreen-fix">
          html,body{height:100%!important;width:100%!important;margin:0!important;padding:0!important;overflow:hidden!important;background:#052e23!important}
          body>.topbar,body>header.topbar{display:none!important;height:0!important;min-height:0!important}
          body>main.hero{
            position:fixed!important;inset:0!important;top:0!important;left:0!important;right:0!important;bottom:0!important;
            width:100%!important;height:100vh!important;height:100dvh!important;
            min-height:0!important;max-height:none!important;margin:0!important;padding:0!important;
            overflow:hidden!important;border:0!important;border-radius:0!important;box-shadow:none!important;
            background-position:center!important;background-size:cover!important;
          }
          body>main.hero>video.ghlgp-home-video{
            display:block!important;position:absolute!important;inset:0!important;
            width:100%!important;height:100%!important;min-width:100%!important;min-height:100%!important;
            object-fit:cover!important;object-position:center center!important;
          }
          body>main.hero::before{inset:0!important}
          body>main.hero::after{bottom:0!important;height:100%!important;pointer-events:none!important}
          body>main.hero>.credit{bottom:16px!important}
          @media(max-width:720px){body>main.hero>.credit{bottom:10px!important}}
          </style>
          '''
          assert '</head>' in s
          s=s.replace('</head>',insert+'</head>',1)
          p.write_text(s,'utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ghlgp-home-fullscreen-20261026.yml
          git add home.html
          git commit -m "Buang jalur hijau dan papar video homepage skrin penuh"
          git push
